            type: string
          - name: title
            label: Heading
            type: string
          - name: message
            label: Message
            type: text
          - name: instagram_label
            label: Instagram button text
            type: string
          - name: instagram_url
            label: Instagram profile link
            type: string
            description: Use the full profile URL beginning with https://
      - name: footer
        label: Footer
        type: object
        fields:
          - name: copyright
            label: Footer text
            type: string
